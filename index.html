<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alberto Ayza | Cybersecurity &amp; Web Development Portfolio</title>
    <!-- 🔎 Lo que muestra Google debajo del título -->
    <meta
      name="description"
      content="Portfolio of Alberto Ayza: cybersecurity student, junior ethical hacking researcher and web developer. Write-ups, projects and news."
    />
    <!-- 🎨 Color de la barra del navegador en el celular (el mismo gris de tu navbar) -->
    <meta name="theme-color" content="#212529" />
    <!-- 🔗 La dirección "oficial" de la página -->
    <link rel="canonical" href="https://cobrasecx.github.io/portfolio/" />

    <!-- 📣 Open Graph: la tarjeta al compartir en LinkedIn, WhatsApp, etc. -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Alberto Ayza | Cybersecurity &amp; Web Development Portfolio"
    />
    <meta
      property="og:description"
      content="Cybersecurity student and junior ethical hacking researcher. Write-ups, projects and news."
    />
    <meta property="og:url" content="https://cobrasecx.github.io/portfolio/" />
    <!-- ⚠️ Debe ser una URL ABSOLUTA, con https:// y el dominio completo -->
    <meta
      property="og:image"
      content="https://cobrasecx.github.io/portfolio/og-image.png"
    />
    <meta property="og:image:alt" content="Photo of Alberto Ayza" />
    <!-- 🐦 Tarjeta para X (Twitter): "summary" va bien con imágenes cuadradas -->
    <meta name="twitter:card" content="summary" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
